# dshremote-bridge：DSH Remote 的电脑端桥插件。
# 用 `dsh plugin --profile desktop add -w <本目录>` 或 plugin_manager 的 install_bundle 装入后，
# 由 profile 的 cordis 加载；同名覆盖会整体替换 config，改配置请直接改这里。
- insert:
    - id: dshremote-bridge
      name: dshremote-bridge
      config:
        enabled: true
        port: 3088
        bind: 0.0.0.0
        token: ''
        proxyEnabled: true
        proxyPort: 7627
        upstreamHost: 127.0.0.1
        upstreamPort: 7626
        answerHeadChars: 120
        questionChars: 200
        logFile: ''
        # 隧道/公网的 host 写这里（或用 GET /trust?token=…&host=… 运行时登记），
        # 都会被塞进 DSH 的 trustedHosts，否则公网访问会被 403 forbidden。
        extraHosts: []
        hostsFile: ''
        # 当前对外的公网地址（例如 Cloudflare 隧道域名）。二维码和自动发现都会带上它；
        # 隧道地址每次重启会变，所以运行时用 GET /public?token=…&url=… 更新即可，自动落盘。
        publicUrl: ''
        publicUrlFile: ''
        # 局域网自动发现：每 2 秒向 255.255.255.255:3089 广播「我是谁、在哪、口令」，
        # 手机 App 监听同一端口就能免手填直接连。不想暴露就设成 false。
        discovery: true
        discoveryPort: 3089
